<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise_05</title>
     <link rel="shortcut icon" href="./images/logo-be01d065.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/bootstrap.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/index.responsive.css">
</head>
<body>
    
    <section id="Register" class="py-5">
        <div class="container">
            <div class="head mb-5 text-center">
                <img src="./images/logo-be01d065.png" alt="">
            </div>
            <div class="body">
                <form action="" class="m-auto p-4 rounded-4" data-type="add">
                    <i class="fa-solid fa-rotate-left reset d-none" onclick="resetForm()"></i>
                    <h4 class="mb-4 text-center">Students System</h4>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" name="firstName" placeholder="First Name *" onblur="checkInput(this)" data-valid="false">
                    </div>
                    <p class="alert alert-danger d-none" data-error-name="firstName" role="alert"></p>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" name="lastName" placeholder="Last Name *" onblur="checkInput(this)" data-valid="false">
                    </div>
                    <p class="alert alert-danger d-none" data-error-name="lastName" role="alert"></p>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input type="text" class="form-control"  name="email" placeholder="Email *" onblur="checkInput(this)" data-valid="false">
                    </div>
                    <p class="alert alert-danger d-none" data-error-name="email" role="alert"></p>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-hashtag"></i></span>
                        <input type="text" class="form-control" name="age" placeholder="Age *" onblur="checkInput(this)" data-valid="false">
                    </div>
                    <p class="alert alert-danger d-none"  data-error-name="age" role="alert"></p>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-mobile-button"></i></span>
                        <input type="text" class="form-control"  name="phone" placeholder="Phone *" onblur="checkInput(this)" data-valid="false">
                    </div>
                    <p class="alert alert-danger d-none" data-error-name="phone" role="alert"></p>
                    <button class="btn btn-success w-100">Add</button>
                </form>
            </div>
        </div>
    </section>
    <section id="Search">
                    <div class="input-group mb-3">
                        <span class="input-group-text" ><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" class="form-control" id="SearchInput" name="search" placeholder="Search..." onblur="checkInput(this)">
                    </div>
    </section>

    <section id="Data" class=" m-auto my-5">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
  <thead class="table-dark">
    <tr>
      <th>#</th>
      <th style="text-wrap: nowrap;">First Name</th>
      <th style="text-wrap: nowrap;">Last Name</th>
      <th>Email</th>
      <th>Age</th>
      <th>Phone</th>
      <th>Options</th>
    </tr>
  </thead>
  <tbody>
   <tr>
    <td id="TableAlert" class="table-warning text-center" colspan="7">There are no data</td>
   </tr>
  </tbody>
</table>
        </div>
    </section>

     <div class="popup">
        <div class="box">
            <h3 class="text-center text-black">Are you sure?</h3>
            <div class="d-flex justify-content-center gap-2">
                <button class="btn btn-success" id="yes">Yes</button>
                <button class="btn btn-danger" id="no">No</button>
            </div>
        </div>
    </div>

    <script src="./js/bootstrap.js"></script>
    <script src="./js/functions.js"></script>
    <script src="./js/index.js"></script>
</body>
</html>
