<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise_05</title>
     <link rel="shortcut icon" href="./images/logo-be01d065.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/bootstrap.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/index.responsive.css">
</head>
<body>
    <section id="Register" class="py-5">
        <div class="container">
            <div class="head mb-5 text-center">
                <img src="./images/logo-be01d065.png" alt="">
            </div>
            <div class="body">
                <form action="" class="m-auto p-4 rounded-4">
                    <h4 class="mb-4 text-center">Students System</h4>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" name="firstName" placeholder="First Name *">
                    </div>
                    <p class="alert alert-warning d-none" data-error-name="firstName" role="alert"></p>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" name="lastName" placeholder="Last Name *">
                    </div>
                    <p class="alert alert-warning d-none" data-error-name="lastName" role="alert"></p>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input type="text" class="form-control" data-error-name="email" name="email" placeholder="Email *">
                    </div>
                    <p class="alert alert-warning d-none" role="alert"></p>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-hashtag"></i></span>
                        <input type="text" class="form-control" data-error-name="age" name="age" placeholder="Age *">
                    </div>
                    <p class="alert alert-warning d-none" role="alert"></p>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-mobile-button"></i></span>
                        <input type="text" class="form-control" data-error-name="phone" name="phone" placeholder="Phone *">
                    </div>
                    <p class="alert alert-warning d-none" role="alert"></p>
                    <button class="btn btn-success w-100">Add</button>
                </form>
            </div>
        </div>
    </section>
    <section id="Search">
                    <div class="input-group mb-3">
                        <span class="input-group-text" ><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" class="form-control" name="search" placeholder="Search...">
                    </div>
    </section>

    <section id="Data" class=" m-auto my-5">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
  <thead class="table-dark">
    <tr>
      <th>#</th>
      <th style="text-wrap: nowrap;">First Name</th>
      <th style="text-wrap: nowrap;">Last Name</th>
      <th>Email</th>
      <th>Age</th>
      <th>Phone</th>
      <th>Options</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row">1</th>
      <td>Mark</td>
      <td>Otto</td>
      <td>@mdo</td>
      <td>@mdo</td>
      <td>@mdo</td>
      <td>
        <div class="buttons">
            <button class="btn btn-info text-light">Edit</button>
            <button class="btn btn-danger text-light">Delete</button>
        </div>
      </td>
    </tr>
  </tbody>
</table>
        </div>
    </section>


    <script src="./js/bootstrap.js"></script>
    <script src="./js/functions.js"></script>
    <script src="./js/index.js"></script>
</body>
</html>
